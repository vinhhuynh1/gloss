# Lint, type-check, test and build every app on each push and pull request.
#
# The Python tests run against a real Postgres, not a mock: the queries under
# test are Postgres-specific (DISTINCT ON, jsonpath, FOR UPDATE SKIP LOCKED).
# The service gets infra/migrations/ applied in order, the same files
# docker-compose runs on first boot. infra/supabase/ is skipped for the same
# reason it is there: it references auth.users, which plain Postgres lacks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # src/lib/env.ts refuses to load without these, and the tests import it.
    # Placeholders only: nothing built here is deployed or contacts them.
    env:
      VITE_DEV_AUTH: "0"
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  realtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/realtime/package-lock.json
      - run: npm ci
      # No test suite of its own (ws-smoke-test.js needs a live deploy and two
      # real tokens); this catches syntax errors and a missing dependency.
      - run: for f in *.js; do node --check "$f"; done
      - run: node -e "require('jose'); require('pg'); require('ws'); require('yjs')"

  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: gloss
          POSTGRES_PASSWORD: gloss
          POSTGRES_DB: gloss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gloss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: gloss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/agent-worker/requirements.txt
            requirements-dev.txt

      - name: Apply migrations
        run: |
          for f in infra/migrations/*.sql; do
            echo "== $f"
            psql -h localhost -U gloss -d gloss -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Install
        # CPU torch first, as in apps/agent-worker/Dockerfile: the default
        # wheel bundles a CUDA runtime that is useless here and huge.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r apps/api/requirements.txt -r apps/agent-worker/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check apps/api apps/agent-worker eval

      - name: API tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gloss:gloss@localhost:5432/gloss
        run: pytest -q

      - name: Worker tests
        working-directory: apps/agent-worker
        env:
          DATABASE_URL: postgresql://gloss:gloss@localhost:5432/gloss
        run: pytest -q
