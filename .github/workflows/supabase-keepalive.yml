# The Supabase free tier pauses a project after 7 days without activity, and a
# paused project needs a manual restore — so a demo link sent with a job
# application goes dead a week later. This runs one real query every three days.
# The API's /health would not do: it never touches the database.
#
# Needs one repository secret, SUPABASE_DB_URL: the session pooler URI in the
# plain postgresql:// form (the same value realtime uses). GitHub disables
# scheduled workflows after 60 days without a commit; re-enable it from the
# Actions tab if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the SUPABASE_DB_URL repository secret."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from study_spaces"
