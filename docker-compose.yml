services:
  db:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: study_notes
      POSTGRES_PASSWORD: study_notes
      POSTGRES_DB: study_notes
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mounts the directory, not one file: the Postgres entrypoint runs every
      # *.sql here in alphabetical order, and only on first boot of an empty
      # volume. infra/supabase/ is deliberately excluded — it references
      # auth.users, which this image has no notion of.
      - ./infra/migrations:/docker-entrypoint-initdb.d

volumes:
  db_data:
